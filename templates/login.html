{% extends "base.html" %}
{% block title %}{{ t('panel.connexion') }} — Casier{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Casier</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="password">{{ t('panel.mot_de_passe') }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           required autofocus>
    <button type="submit">{{ t('panel.se_connecter') }}</button>
  </form>
</div>
{% endblock %}
