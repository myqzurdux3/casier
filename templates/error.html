{% extends "base.html" %}
{% block title %}{{ t('panel.erreur') }} — Casier{% endblock %}
{% block content %}

<div class="card">
  <h2>{{ t('panel.erreur_serveur') }}</h2>
  <p class="flash error">{{ detail }}</p>
  <p class="muted">{{ t('panel.trace_journal') }}<br>
    <code>journalctl -u spotify-sort -n 60 --no-pager</code></p>
  <p><a href="{{ url_for('index') }}">{{ t('panel.retour_tableau') }}</a></p>
</div>

{% endblock %}
