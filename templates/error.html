{% extends "base.html" %}
{% block title %}Erreur — spotify-sort{% endblock %}
{% block content %}

<div class="card">
  <h2>Erreur serveur</h2>
  <p class="flash error">{{ detail }}</p>
  <p class="muted">La trace complète est dans le journal du service :<br>
    <code>journalctl -u spotify-sort -n 60 --no-pager</code></p>
  <p><a href="{{ url_for('index') }}">Retour au tableau de bord</a></p>
</div>

{% endblock %}
